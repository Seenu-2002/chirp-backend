spring:
  application:
    name: chirp-backend

  datasource:
    # Supabase
    url: jdbc:postgresql://db.lbixaegdfkacbzkcvskp.supabase.co:5432/postgres
    username: postgres
    password: ${POSTGRES_PASSWORD}

    # Local Postgres.app
    # url: jdbc:postgresql://localhost:5432/chirp
    # username: seeni-11754
    # password:
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 20000
      connection-timeout: 300000
      max-lifetime: 12000000
      pool-name: SpringBootHikariCP
      data-source-properties:
        prepareThreshold: 5
        preparedStatementCacheQueries: 256
        preparedStatementCacheSizeMiB: 5

        tcpKeepAlive: true
        socketTimeout: 30
        connectTimeout: 10

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        hbm2ddl:
          create_namespaces: true

  logging:
    level:
      com.fasterxml.jackson: DEBUG
      com.fasterxml.jackson.databind.deser: TRACE


jwt:
  secret: ${JWT_SECRET_BASE64}
  expiration-minutes: 15

chirp:
  email:
    verification:
      expiry-hours: 24
    reset-password:
      expiry-minutes: 15